<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSV Viewer Online</title>
  <meta name="description" content="Super simple viewer for CSV files — your data never leaves your browser.">
  <meta name="theme-color" content="#0a0c13">
  <link rel="icon" href="favicon.png">

  <script>
    // set the theme before first paint to avoid a flash
    try {
      var t = localStorage.getItem('csv-viewer-theme')
      if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
      document.documentElement.dataset.theme = t
    } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@13/dist/handsontable.full.min.css">
  <link rel="stylesheet" href="./styles.css?4">
</head>

<body>
  <div class="aurora" aria-hidden="true"></div>

  <!-- ───────────── landing ───────────── -->
  <main class="landing" id="landing">
    <div class="hero">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="4" />
          <path d="M3 9.5h18M3 15h18M9.5 3v18" />
        </svg>
      </span>

      <h1>CSV Viewer</h1>
      <p class="tagline">Drop a spreadsheet in, read it beautifully.<br>Everything runs locally &mdash; your file never leaves this browser.</p>

      <label class="dropzone" id="dropzone" for="input-file">
        <input type="file" id="input-file" accept=".csv,text/csv" class="sr-only">
        <span class="dz-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 15.5V3.5m0 0L8 7.5m4-4 4 4" />
            <path d="M4 14.5v3a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-3" />
          </svg>
        </span>
        <span class="dz-title">Drag &amp; drop your CSV</span>
        <span class="dz-sub">or <b>browse your files</b></span>
      </label>

      <button class="ghost-link" id="sample-btn" type="button">Try it with sample data &rarr;</button>

      <ul class="chips">
        <li class="chip">No upload</li>
        <li class="chip">Sort &amp; search</li>
        <li class="chip">Big files welcome</li>
      </ul>
    </div>
  </main>

  <!-- ───────────── viewer ───────────── -->
  <section class="viewer" id="viewer">
    <header class="toolbar">
      <div class="tb-group">
        <span class="brand-mark sm">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="4" />
            <path d="M3 9.5h18M3 15h18M9.5 3v18" />
          </svg>
        </span>
        <div class="file-meta">
          <span class="file-name" id="file-name">data.csv</span>
          <span class="file-stats" id="file-stats">&mdash;</span>
        </div>
      </div>

      <div class="tb-group">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
          <input type="search" id="search" placeholder="Search rows…" autocomplete="off" spellcheck="false">
        </div>
        <button class="btn" id="new-file" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14" />
          </svg>
          <span>New file</span>
        </button>
      </div>
    </header>

    <div class="table-wrap">
      <div id="handsontable-container"></div>
      <div class="empty" id="empty" hidden>
        <strong>No matching rows</strong>
        <span>Try a different search term.</span>
      </div>
    </div>
  </section>

  <!-- ───────────── chrome ───────────── -->
  <button class="icon-btn theme-toggle" id="theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme">
    <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4.2" />
      <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4" />
    </svg>
    <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2Z" />
    </svg>
  </button>

  <div class="drop-overlay" id="drop-overlay" aria-hidden="true">
    <div class="drop-overlay-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 15.5V3.5m0 0L8 7.5m4-4 4 4" />
        <path d="M4 14.5v3a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-3" />
      </svg>
      <span>Release to open</span>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/handsontable@13/dist/handsontable.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5"></script>
  <script src="./app.js?4"></script>
</body>

</html>
